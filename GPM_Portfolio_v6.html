<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPM Initiatives — v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!--BOOTSTRAP-->
<style>
:root{
  --red:#C8102E; --red-dark:#9c0a23; --red-soft:#fef2f4;
  --ink:#1a1f2e; --ink-soft:#4a5567; --muted:#8b95a7;
  --line:#e8ebf0; --line-soft:#f1f3f6;
  --bg:#faf8f3; --paper:#ffffff; --cream:#f7f4ed;
  --green:#16a34a; --green-soft:#dcfce7; --green-bg:#f0f7f0;
  --amber:#f59e0b; --amber-soft:#fef3c7;
  --coral-bg:#fdf2f3;
  --blue:#3b82f6; --blue-soft:#dbeafe;
  --axis-bg:#eef2f7;
  --row-stripe:#fbf9f4;
  --bar-solid:#475569; --bar-faded:#cbd5e1;
  --shadow-sm:0 1px 2px rgba(20,24,40,.04);
  --shadow:0 4px 16px rgba(20,24,40,.06);
  --shadow-lg:0 20px 50px rgba(20,24,40,.18);
  --serif:'Playfair Display', Georgia, serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

.app{display:flex;flex-direction:column;min-height:100vh}

.topbar{padding:22px 48px 18px;background:#fff;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px}
.page-title{font-family:var(--serif);font-size:40px;font-weight:700;letter-spacing:-.5px;line-height:1.05;color:var(--ink)}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;font-size:12.5px;font-weight:500;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:all .15s ease;cursor:pointer}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn.primary:hover{background:var(--red-dark);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--red);background:var(--red-soft)}
.fullscreen-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:#fff;border:1px solid var(--line)}

.content{flex:1;padding:28px 48px 36px;overflow-y:auto}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px}
.kpi{background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--line-soft);position:relative}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:4px}
.kpi.ontrack::before{background:var(--green)}
.kpi.watch::before{background:var(--amber)}
.kpi.atrisk::before{background:var(--red)}
.kpi.avg::before{background:var(--blue)}
.kpi.ontrack{background:linear-gradient(180deg,var(--green-bg) 0%,#fff 65%)}
.kpi.watch{background:linear-gradient(180deg,#fffbf0 0%,#fff 65%)}
.kpi.atrisk{background:linear-gradient(180deg,var(--coral-bg) 0%,#fff 65%)}
.kpi.avg{background:linear-gradient(180deg,#eff6ff 0%,#fff 65%)}
.kpi-inner{padding:22px 24px}
.kpi-label{font-size:10.5px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kpi-val{font-family:var(--serif);font-size:46px;font-weight:700;line-height:1;color:var(--ink)}
.kpi-sub{font-size:11.5px;color:var(--ink-soft);margin-top:8px}
.kpi-val .small{font-size:22px;color:var(--muted);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
.dot.green{background:var(--green)} .dot.amber{background:var(--amber)} .dot.red{background:var(--red)} .dot.blue{background:var(--blue)}

.gantt-section{background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line-soft);overflow:hidden;margin-bottom:24px}

.gantt-table{display:flex;flex-direction:column}
.gantt-axis{display:grid;grid-template-columns:250px 100px 1fr 130px;background:var(--axis-bg);border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-weight:600}
.axis-h{padding:10px 14px}
.axis-h.bar-h{padding:0;position:relative}
.axis-years{display:flex;height:24px;border-bottom:1px solid var(--line-soft)}
.axis-year{flex:1;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line-soft);font-weight:700;color:var(--ink-soft);font-size:11px}
.axis-year:last-child{border-right:none}
.axis-qs{display:flex;height:22px}
.axis-q{flex:1;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line-soft);font-size:10px}
.axis-q:last-child{border-right:none}

.gantt-row{display:grid;grid-template-columns:250px 100px 1fr 130px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .15s;position:relative;min-height:72px;align-items:stretch}
.gantt-row:nth-child(even){background:var(--row-stripe)}
.gantt-row:hover{background:#fff8f0}
.gantt-row.add-row{cursor:pointer;background:transparent;border:2px dashed var(--line);border-radius:0;margin:14px 24px;padding:18px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;min-height:auto;gap:10px;transition:all .15s}
.gantt-row.add-row:hover{border-color:var(--red);color:var(--red);background:var(--red-soft)}

.gantt-identity{padding:14px 14px 14px 18px;display:flex;gap:12px;align-items:center;border-left:4px solid var(--muted);position:relative}
.gantt-row.ontrack .gantt-identity{border-left-color:var(--green)}
.gantt-row.watch .gantt-identity{border-left-color:var(--amber)}
.gantt-row.atrisk .gantt-identity{border-left-color:var(--red)}
.row-icon{width:40px;height:40px;border-radius:10px;background:var(--line-soft);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background-size:cover;background-position:center;color:#fff}
.row-info{min-width:0;flex:1;display:flex;align-items:center}
.row-name{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.25;color:var(--ink)}

.gantt-owner{display:flex;align-items:center;justify-content:center;padding:14px 6px}
.owner-pill{background:var(--line-soft);color:var(--ink-soft);padding:5px 12px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}

.gantt-bar-cell{position:relative;padding:14px 6px;display:flex;align-items:center}
.bar-track{position:relative;width:100%;height:30px}
.bar{position:absolute;top:11px;height:7px;border-radius:99px;display:flex;align-items:center;overflow:visible}
.bar-solid{height:7px;border-radius:99px 0 0 99px;background:var(--bar-solid)}
.bar-faded{height:7px;border-radius:0 99px 99px 0;background:var(--bar-faded)}
.bar.unknown{background:var(--line);opacity:.6}
.bar-label{position:absolute;top:-18px;font-size:10px;color:var(--muted);white-space:nowrap}
.bar-label.start{left:0}
.bar-label.end{right:0}
.bar-ms{position:absolute;top:9px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--muted);transform:translateX(-50%);cursor:default;z-index:2}
.bar-ms.done{border-color:var(--green);background:var(--green)}
.bar-ms.inprogress{border-color:var(--amber);background:var(--amber)}
.bar-ms.planned{border-color:var(--muted);background:#fff}

.gantt-progress{padding:14px 16px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px}
.status-pill{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;padding:4px 9px;border-radius:99px;color:#fff}
.status-pill.ontrack{background:var(--green)}
.status-pill.watch{background:var(--amber)}
.status-pill.atrisk{background:var(--red)}
.prog-val{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink);line-height:1}
.prog-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}

.footer-bar{background:#fff;border-top:1px solid var(--line);padding:14px 48px;display:flex;justify-content:space-between;align-items:center;gap:24px;font-size:12px;color:var(--muted)}
.footer-bar .ok{color:var(--green);font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(20,24,40,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s ease}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100vh;width:560px;max-width:95vw;background:var(--bg);z-index:51;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.15)}
.panel.open{transform:translateX(0)}
.panel-hero{padding:22px 28px 22px;color:#fff;position:relative;background:linear-gradient(135deg,var(--ink) 0%,var(--red-dark) 100%);background-size:cover;background-position:center;min-height:170px}
.panel-hero-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(26,31,46,.78),rgba(156,10,35,.82));z-index:0}
.panel-hero > *{position:relative;z-index:1}
.panel-close{position:absolute;top:14px;right:14px;width:34px;height:34px;background:rgba(255,255,255,.18);border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:2}
.panel-close:hover{background:rgba(255,255,255,.3)}
.panel-thumb-btn{position:absolute;top:14px;right:58px;background:rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:6px 10px;font-size:11px;z-index:2}
.panel-thumb-btn:hover{background:rgba(255,255,255,.3)}
.panel-status{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:4px;display:inline-block;margin-bottom:12px;cursor:pointer;border:none}
.panel-status-wrap{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.panel-name{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2;margin-bottom:8px;outline:none;padding:2px 4px;border-radius:4px;margin-left:-4px}
.panel-name:focus{background:rgba(255,255,255,.12)}
.panel-meta{font-size:12px;color:rgba(255,255,255,.85);display:flex;gap:14px;flex-wrap:wrap}
.panel-meta input{background:transparent;border:1px dashed transparent;color:#fff;padding:1px 5px;border-radius:3px;width:auto}
.panel-meta input:focus{border-color:rgba(255,255,255,.3);outline:none}
.panel-meta label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.55);margin-right:4px}

.panel-body{flex:1;overflow-y:auto;padding:22px 22px 100px}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.metric-tile{background:#fff;padding:12px 14px}
.metric-label{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;font-weight:600;margin-bottom:4px}
.metric-val{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink)}
.metric-val input{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);background:transparent;border:1px dashed transparent;padding:1px 3px;border-radius:3px;width:100%}
.metric-val input:focus{border-color:var(--line);outline:none}
.metric-val.red{color:var(--red)}
.metric-val.red input{color:var(--red)}

.psection{border-radius:12px;padding:16px 18px;margin-bottom:14px;border:1px solid transparent}
.psection.summary{background:#fff;border-color:var(--line-soft)}
.psection.milestones{background:#eff6ff;border-color:#c7dcf5}
.psection.highlights{background:var(--green-bg);border-color:#d7ead7}
.psection.risks{background:var(--coral-bg);border-color:#fadddf}
.psection.ppt{background:var(--red-soft);border-color:#f8d7dd}

.psection-head{font-size:11px;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.add-btn{font-size:11px;color:var(--red);font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.6)}
.add-btn:hover{background:#fff}

.one-liner-edit{width:100%;padding:10px 12px;background:#fff;border:1px solid var(--line-soft);border-radius:8px;font-size:13px;color:var(--ink-soft);line-height:1.5;resize:vertical;min-height:60px;font-style:italic}
.one-liner-edit:focus{outline:none;border-color:var(--red)}

.del-btn{opacity:0;background:transparent;color:var(--muted);font-size:14px;padding:2px 6px;border-radius:4px;transition:opacity .15s}
.risk:hover .del-btn,.hi:hover .del-btn,.ms-item:hover .del-btn{opacity:1}
.del-btn:hover{background:var(--red-soft);color:var(--red)}

.ms-list{position:relative;padding-left:22px}
.ms-list::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#c7dcf5}
.ms-item{position:relative;padding-bottom:10px;display:flex;gap:8px;align-items:center}
.ms-dot{position:absolute;left:-22px;top:6px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--muted);background:#fff;cursor:pointer;flex-shrink:0}
.ms-dot.done{background:var(--green);box-shadow:0 0 0 2px var(--green)}
.ms-dot.inprogress{background:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.ms-dot.planned{background:#fff;box-shadow:0 0 0 2px var(--muted)}
.ms-item input.ms-name{flex:1;padding:6px 9px;background:#fff;border:1px solid #c7dcf5;border-radius:5px;font-size:13px;color:var(--ink)}
.ms-item input.ms-name:focus{outline:none;border-color:var(--red)}
.ms-item input.ms-date{width:100px;padding:6px 9px;background:#fff;border:1px solid #c7dcf5;border-radius:5px;font-size:11.5px;color:var(--muted)}
.ms-item input.ms-date:focus{outline:none;border-color:var(--red)}

.risk{display:flex;gap:10px;padding:10px;background:#fff;border:1px solid #fadddf;border-radius:8px;margin-bottom:8px;align-items:flex-start}
.risk-sev{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:8px;cursor:pointer}
.risk-sev.high{background:var(--red)} .risk-sev.medium{background:var(--amber)} .risk-sev.low{background:var(--muted)}
.risk-fields{flex:1;display:flex;flex-direction:column;gap:4px}
.risk-fields input{padding:5px 7px;border:1px dashed transparent;border-radius:4px;background:transparent;font-size:13px;width:100%}
.risk-fields input:focus{outline:none;border-color:var(--red);background:#fff}
.risk-fields .mit{font-size:12px;color:var(--ink-soft);font-style:italic}
.risk-sev-select{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:2px}

.hi{display:flex;gap:8px;align-items:center;padding:7px 10px;background:#fff;border:1px solid #d7ead7;border-radius:6px;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
.hi-check{color:var(--green);font-weight:700;flex-shrink:0}
.hi-text{flex:1;padding:3px 5px;border:1px dashed transparent;border-radius:4px;background:transparent}
.hi-text:focus{outline:none;border-color:var(--red);background:#fff}

.ppt-card{display:flex;align-items:center;gap:12px}
.ppt-ico{width:36px;height:36px;border-radius:8px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ppt-fields{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.ppt-fields input{padding:6px 9px;border:1px solid var(--line-soft);border-radius:5px;background:#fff;font-size:12px;color:var(--ink-soft);width:100%;text-overflow:ellipsis}
.ppt-fields input:focus{outline:none;border-color:var(--red)}
.ppt-open{padding:7px 12px;background:var(--red);color:#fff;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.ppt-open:hover{background:var(--red-dark)}
.ppt-open.disabled{background:var(--muted);pointer-events:none;opacity:.5}

.status-menu{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-lg);padding:4px;z-index:200;display:none}
.status-menu.open{display:block}
.status-menu button{display:block;width:100%;text-align:left;padding:7px 14px;border-radius:5px;font-size:12px;letter-spacing:.5px}
.status-menu button:hover{background:var(--line-soft)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:300;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.panel:not(.edit-mode) .add-btn,
.panel:not(.edit-mode) .del-btn,
.panel:not(.edit-mode) .panel-thumb-btn,
.panel:not(.edit-mode) .delete-init{display:none !important}
.panel:not(.edit-mode) input,
.panel:not(.edit-mode) textarea{pointer-events:none;background:transparent !important;border-color:transparent !important;box-shadow:none !important}
.panel:not(.edit-mode) [contenteditable]{pointer-events:none}
.panel:not(.edit-mode) .panel-status,
.panel:not(.edit-mode) .risk-sev,
.panel:not(.edit-mode) .ms-dot{pointer-events:none;cursor:default}

.edit-toggle{display:flex;align-items:center;justify-content:center;gap:8px;margin:24px auto 0;padding:11px 26px;background:var(--ink);color:#fff;border-radius:8px;font-size:13px;font-weight:500;letter-spacing:.3px;cursor:pointer;box-shadow:var(--shadow);transition:all .15s}
.edit-toggle:hover{background:var(--red)}
.panel.edit-mode .edit-toggle{background:var(--green)}
.panel.edit-mode .edit-toggle:hover{background:#15803d}
.mode-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.5px;text-transform:uppercase}

@media print{
  .topbar-actions,.footer-bar,.fullscreen-btn,.panel,.scrim,.toast{display:none !important}
  body{background:#fff}
  .gantt-section{break-inside:avoid}
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div>
      <div class="page-title">GPM Initiatives</div>
      <input type="hidden" id="meetingDate" value="3 Jul 2026">
    </div>
    <div class="topbar-actions">
      <button class="btn primary" onclick="exportSelfContained()" title="Share via Teams">&#128190; Export &amp; Share</button>
      <button class="fullscreen-btn" onclick="toggleFullScreen()" title="Fullscreen">⛶</button>
    </div>
  </header>

  <main class="content">
    <div class="kpi-row" id="kpiRow"></div>

    <div class="gantt-section">
      <div class="gantt-table" id="ganttTable"></div>
    </div>
  </main>

  <div class="footer-bar">
    <div>Self-contained file — share via Teams. Edits saved automatically (<span id="storageInfo">localStorage</span>).</div>
    <div class="ok">● Auto-saved</div>
  </div>
</div>

<div class="scrim" id="scrim" onclick="closePanel()"></div>
<aside class="panel" id="panel">
  <div class="panel-hero" id="panelHero"></div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<input type="file" id="thumbInput" accept="image/*" style="display:none">

<div class="status-menu" id="statusMenu">
  <button onclick="setStatus('On Track')">● On Track</button>
  <button onclick="setStatus('Watch')">● Watch</button>
  <button onclick="setStatus('At Risk')">● At Risk</button>
</div>
<div class="status-menu" id="sevMenu">
  <button onclick="setSeverity('High')">● High</button>
  <button onclick="setSeverity('Medium')">● Medium</button>
  <button onclick="setSeverity('Low')">● Low</button>
</div>

<div class="toast" id="toast"></div>

<script>
const SAMPLE = {
  meeting: "3 Jul 2026",
  initiatives: [
    {id:"UMS", name:"Utilities Management System", owner:"Lexi", business_unit:"SC & MPACT",
     category:"Operational Effectiveness", status:"On Track", start:"Dec 2024", end:"Jun 2026",
     progress_pct:75, headline_metric:"TMS Go-Live SC \u2713 Feb 2026",
     one_liner:"Tenant metering decoupled from retailers; BMS integration may extend beyond Jun 2026",
     hero_image:"", ppt_link:"", emoji:"\u26A1"},
    {id:"GENAI", name:"GenAI for Tender Evaluation", owner:"Lexi", business_unit:"GPM",
     category:"AI / Procurement", status:"Watch", start:"Nov 2025", end:"Q3 2026",
     progress_pct:30, headline_metric:"POC Nov 25 & Jan 26",
     one_liner:"IS&T checklist submitted; awaiting risk assessment outcome",

const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseFlexDate(str){
  if(!str) return null;
  const s = String(str).trim();
  let m = s.match(/^Q([1-4])\s+(\d{4})$/i);
  if(m){ return new Date(+m[2], (parseInt(m[1])-1)*3, 1); }
  m = s.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})$/);
  if(m){ const mon = MONTHS[m[2].toLowerCase().slice(0,3)]; if(mon!=null) return new Date(+m[3], mon, +m[1]); }
  m = s.match(/^([A-Za-z]{3})[a-z]*\s+(\d{4})$/);
  if(m){ const mon = MONTHS[m[1].toLowerCase().slice(0,3)]; if(mon!=null) return new Date(+m[2], mon, 1); }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m){ return new Date(+m[1], +m[2]-1, +m[3]); }
  m = s.match(/^(\d{4})$/);
  if(m){ return new Date(+m[1], 0, 1); }
  return null;
}

function computeAxis(){
  const all = DATA.initiatives.map(i=>({s:parseFlexDate(i.start), e:parseFlexDate(i.end)}))
    .filter(o=>o.s && o.e);
  if(!all.length) return {min:new Date(2025,0,1), max:new Date(2027,0,1)};
  let min = all.reduce((a,b)=> b.s < a ? b.s : a, all[0].s);
  let max = all.reduce((a,b)=> b.e > a ? b.e : a, all[0].e);
  min = new Date(min.getFullYear(), min.getMonth()-1, 1);
  max = new Date(max.getFullYear(), max.getMonth()+2, 1);
  return {min, max};
}
function pct(date, axis){
  if(!date) return null;
  const t = date - axis.min;
  const total = axis.max - axis.min;
  return Math.max(0, Math.min(100, (t/total)*100));
}

function renderAxis(axis){
  const yStart = axis.min.getFullYear();
  const yEnd = axis.max.getFullYear();
  const totalMs = axis.max - axis.min;
  let years = "";
  for(let y=yStart; y<=yEnd; y++){
    const yMin = new Date(y,0,1);
    const yMax = new Date(y+1,0,1);
    const start = Math.max(yMin, axis.min);
    const end = Math.min(yMax, axis.max);
    if(end <= start) continue;
    const widthPct = ((end - start)/totalMs)*100;
    years += `<div class="axis-year" style="flex:0 0 ${widthPct}%">${y}</div>`;
  }
  let qs = "";
  for(let y=yStart; y<=yEnd; y++){
    for(let q=0; q<4; q++){
      const qStart = new Date(y, q*3, 1);
      const qEnd = new Date(y, q*3+3, 1);
      const start = qStart < axis.min ? axis.min : qStart;
      const end = qEnd > axis.max ? axis.max : qEnd;
      if(end <= start) continue;
      const widthPct = ((end - start)/totalMs)*100;
      qs += `<div class="axis-q" style="flex:0 0 ${widthPct}%">Q${q+1}</div>`;
    }
  }
  return `
    <div class="gantt-axis">
      <div class="axis-h">Initiative</div>
      <div class="axis-h" style="text-align:center">Owner</div>
      <div class="axis-h bar-h">
        <div class="axis-years">${years}</div>
        <div class="axis-qs">${qs}</div>
      </div>
      <div class="axis-h" style="text-align:right">Progress</div>
    </div>`;
}

function renderRow(i, axis){
  const sCls = statusClass(i.status);
  const s = parseFlexDate(i.start);
  const e = parseFlexDate(i.end);
  let bar = "";
  if(s && e && e > s){
    const sPct = pct(s, axis);
    const ePct = pct(e, axis);
    const todayClamped = TODAY < s ? s : (TODAY > e ? e : TODAY);
    const tPct = pct(todayClamped, axis);
    const widthSolid = Math.max(0, tPct - sPct);
    const widthFaded = Math.max(0, ePct - tPct);
    const ms = DATA.milestones.filter(m=>m.initiative_id===i.id)
      .map(m=>({...m, _d:parseFlexDate(m.date)}))
      .filter(m=>m._d);
    let msHtml = ms.map(m=>{
      const p = pct(m._d, axis);
      return `<div class="bar-ms ${m.status.toLowerCase()}" style="left:${p}%" title="${escapeHTML(m.milestone)} \u00B7 ${escapeHTML(m.date)}"></div>`;
    }).join("");
    bar = `
      <div class="bar" style="left:${sPct}%;width:${widthSolid}%">
        <div class="bar-solid" style="width:100%"></div>
        <div class="bar-label start" style="left:0">${escapeHTML(i.start)}</div>
      </div>
      <div class="bar" style="left:${tPct}%;width:${widthFaded}%;opacity:.85">
        <div class="bar-faded" style="width:100%"></div>
        <div class="bar-label end" style="right:0;color:var(--ink-soft)">${escapeHTML(i.end)}</div>
      </div>
      ${msHtml}
    `;
  } else {
    bar = `<div class="bar unknown" style="left:0;width:100%;opacity:.4">
      <div class="bar-solid" style="width:100%"></div>
    </div>`;
  }

  const heroBg = i.hero_image
    ? `background-image:url('${i.hero_image}')`
    : `background:linear-gradient(135deg,${
        i.category==="Sustainability"?"#065f46,#10b981":
        i.category==="Operational Effectiveness"?"#1e3a8a,#3b82f6":
        i.category==="AI / Procurement"?"#5b21b6,#a855f7":
        i.category==="Tenant Experience"?"#9a3412,#f97316":
        i.category==="Safety Ops"?"#7f1d1d,#dc2626":"#374151,#6b7280"
      })`;

  return `
    <div class="gantt-row ${sCls}" data-id="${escapeHTML(i.id)}">
      <div class="gantt-identity">
        <div class="row-icon" style="${heroBg}">${i.hero_image?"":i.emoji||"\u25C6"}</div>
        <div class="row-info">
          <div class="row-name">${escapeHTML(i.name)}</div>
        </div>
      </div>
      <div class="gantt-owner">
        <div class="owner-pill" title="${escapeHTML(i.owner)}">${escapeHTML(i.owner||"\u2014")}</div>
      </div>
      <div class="gantt-bar-cell">
        <div class="bar-track">
          ${bar}
        </div>
      </div>
      <div class="gantt-progress">
        <span class="status-pill ${sCls}">${escapeHTML(i.status)}</span>
        <div class="prog-val">${i.progress_pct}<span style="font-size:18px;color:var(--muted)">%</span></div>
        <div class="prog-sub">Progress</div>
      </div>
    </div>`;
}

        <div class="ppt-ico">\uD83D\uDCCA</div>

          <input placeholder="SharePoint URL (paste here)" value="${escapeHTML(i.ppt_link||'')}" onchange="updPPT(this.value)">
        </div>
        <a class="ppt-open ${pptValid?'':'disabled'}" href="${pptHref}" target="_blank" rel="noopener noreferrer">Open \u2197</a>
      </div>
    </div>

    <div style="margin-top:14px;text-align:right">
      <button class="btn ghost delete-init" onclick="deleteInitiative()" style="color:var(--red)">\uD83D\uDDD1 Delete this initiative</button>
    </div>

    <button class="edit-toggle" onclick="toggleEditMode()">
      ${EDIT_MODE ? "\u2713 Done editing" : "\u270E Enter Edit Mode"}
    </button>
    <div class="mode-hint">${EDIT_MODE ? "Edit mode \u2014 changes auto-save" : "View mode \u2014 clean for presenting"}</div>
  `;
  document.getElementById("panelBody").innerHTML = body;
}

function updField(f, v){
  const i = getInitiative();
  if(!i) return;
  i[f] = v;
  save();
  renderKPI(); renderGantt();
}
function updPPT(v){
  const i = getInitiative();
  if(!i) return;
  i.ppt_link = (v||"").trim();
  save();
  renderGantt();
  renderPanel();
}
function updMS(idx, f, v){ DATA.milestones[idx][f] = v; save(); renderGantt(); }
function delMS(idx){ DATA.milestones.splice(idx,1); save(); renderPanel(); renderGantt(); }
function addMilestone(){ DATA.milestones.push({initiative_id:currentId, milestone:"New milestone", date:"TBD", status:"Planned"}); save(); renderPanel(); renderGantt(); }
function cycleMSStatus(idx){
  const cycle = {"Planned":"InProgress","InProgress":"Done","Done":"Planned"};
  DATA.milestones[idx].status = cycle[DATA.milestones[idx].status] || "Planned";
  save(); renderPanel(); renderGantt();
}

function updHI(idx, v){ DATA.highlights[idx].bullet = v; save(); }
function delHI(idx){ DATA.highlights.splice(idx,1); save(); renderPanel(); }
function addHighlight(){ DATA.highlights.push({initiative_id:currentId, bullet:"New highlight"}); save(); renderPanel(); }

function updRisk(idx, f, v){ DATA.risks[idx][f] = v; save(); }
function delRisk(idx){ DATA.risks.splice(idx,1); save(); renderPanel(); }
function addRisk(){ DATA.risks.push({initiative_id:currentId, risk:"New risk", severity:"Medium", mitigation:""}); save(); renderPanel(); }

let sevIdx = null;
function openStatusMenu(e){
  e.stopPropagation();
  const menu = document.getElementById("statusMenu");
  const r = e.target.getBoundingClientRect();
  menu.style.top = (r.bottom+4)+"px"; menu.style.left = r.left+"px";
  menu.classList.add("open");
}
function setStatus(s){
  const i = getInitiative();
  if(i){ i.status = s; save(); renderKPI(); renderGantt(); renderPanel(); }
  document.getElementById("statusMenu").classList.remove("open");
}
function openSevMenu(e, idx){
  e.stopPropagation();
  sevIdx = idx;
  const menu = document.getElementById("sevMenu");
  const r = e.target.getBoundingClientRect();
  menu.style.top = (r.bottom+4)+"px"; menu.style.left = r.left+"px";
  menu.classList.add("open");
}
function setSeverity(s){
  if(sevIdx!=null){ DATA.risks[sevIdx].severity = s; save(); renderPanel(); }
  document.getElementById("sevMenu").classList.remove("open");
}
document.addEventListener("click",()=>{
  document.getElementById("statusMenu").classList.remove("open");
  document.getElementById("sevMenu").classList.remove("open");
});

function uploadThumb(){ document.getElementById("thumbInput").click(); }
document.getElementById("thumbInput").addEventListener("change", (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  if(f.size > 3*1024*1024){
    if(!confirm("Image is large ("+(f.size/1024/1024).toFixed(1)+" MB). Continue?")){
      e.target.value = ""; return;
    }
  }
  const reader = new FileReader();
  reader.onload = ev =>{
    const i = getInitiative();
    if(i){
      i.hero_image = ev.target.result;
      save(); renderGantt(); renderPanel();
      toast("\u2713 Photo uploaded");
    }
  };
  reader.readAsDataURL(f);
  e.target.value = "";
});

function addInitiative(){
  const name = prompt("Initiative name?");
  if(!name) return;
  const id = "INI_" + Date.now();
  DATA.initiatives.push({
    id, name, owner:"TBD", business_unit:"", category:"Operational Effectiveness",
    status:"On Track", start:"Jul 2026", end:"Dec 2026", progress_pct:0,
    headline_metric:"", one_liner:"", hero_image:"",
    ppt_link:"", emoji:"\u25C6"
  });
  save(); renderKPI(); renderGantt();
  openPanel(id);
}
function deleteInitiative(){
  if(!confirm("Delete this initiative and all its milestones/highlights/risks?")) return;
  DATA.initiatives = DATA.initiatives.filter(x=>x.id!==currentId);
  DATA.milestones = DATA.milestones.filter(x=>x.initiative_id!==currentId);
  DATA.risks = DATA.risks.filter(x=>x.initiative_id!==currentId);
  DATA.highlights = DATA.highlights.filter(x=>x.initiative_id!==currentId);
  currentId = null;
  save(); renderKPI(); renderGantt(); closePanel();
  toast("\u2713 Initiative deleted");
}

function exportSelfContained(){
  const docClone = document.documentElement.cloneNode(true);
  const prior = docClone.querySelector("#bootstrapData");
  if(prior) prior.remove();
  const head = docClone.querySelector("head");
  const script = document.createElement("script");
  script.id = "bootstrapData";
  script.type = "application/json";
  script.textContent = JSON.stringify(DATA);
  head.appendChild(script);
  docClone.querySelectorAll(".panel.open,.scrim.open,.status-menu.open,.panel.edit-mode").forEach(el=>{
    el.classList.remove("open"); el.classList.remove("edit-mode");
  });
  const htmlOut = "<!DOCTYPE html>\n" + docClone.outerHTML;
  const blob = new Blob([htmlOut], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `GPM_Initiatives_${new Date().toISOString().slice(0,10)}.html`;
  a.click();
  toast("\u2713 Self-contained HTML downloaded \u2014 share via Teams");
}

function toggleFullScreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

function renderAll(){
  renderKPI(); renderGantt();
  updateStorageInfo();
}
renderAll();
</script>
</body>
</html>
